<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .message-in {
            animation: slideIn 0.3s ease-out forwards;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    body {

<body class="bg-surface font-body-md text-on-surface overflow-hidden h-screen flex flex-col">
<!-- Top Navigation Shell (Injected from Shared Components) -->

<div class="flex items-center gap-3">

</button>
<div class="flex flex-col">
<h1 class="font-headline-md text-headline-md text-primary">Chat with Support</h1>
<span class="text-label-xs font-label-xs text-secondary leading-none flex items-center gap-1">
<span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span> Online

</div>
<button class="text-secondary hover:bg-surface-container dark:hover:bg-surface-container-highest p-2 rounded-full active:scale-95 transition-transform">

</div>
<div class="bg-surface-container-highest text-on-surface p-3 rounded-2xl rounded-bl-none shadow-sm">
<p class="text-body-md font-body-md leading-relaxed">Sorry to hear that! Can you tell us what went wrong?</p>
<span class="text-[10px] text-secondary mt-1 block">10:42 AM</span>
</div>
</div>
<!-- Quick Replies -->
<div class="flex flex-wrap gap-2 justify-end my-stack-md">
<button class="bg-surface-container-lowest border border-outline-variant px-4 py-2 rounded-full text-label-sm font-label-sm text-on-surface-variant hover:bg-primary-container hover:text-on-primary-container transition-colors active:scale-95">
                Item was damaged
            </button>
<button class="bg-surface-container-lowest border border-outline-variant px-4 py-2 rounded-full text-label-sm font-label-sm text-on-surface-variant hover:bg-primary-container hover:text-on-primary-container transition-colors active:scale-95">
                Wrong item
            </button>
<button class="bg-surface-container-lowest border border-outline-variant px-4 py-2 rounded-full text-label-sm font-label-sm text-on-surface-variant hover:bg-primary-container hover:text-on-primary-container transition-colors active:scale-95">
                Quality issue
            </button>
</div>
<!-- Message: User Selection (Hypothetical) -->
<div class="flex justify-end message-in">

<span class="text-[10px] text-on-primary-container opacity-60 mt-1 block text-right">10:43 AM</span>

</div>
<div class="bg-surface-container-highest text-on-surface p-3 rounded-2xl rounded-bl-none shadow-sm">
<p class="text-body-md font-body-md">Let me check what we can do for you...</p>
<div class="flex gap-1 mt-2">
<div class="w-1.5 h-1.5 bg-secondary rounded-full typing-dot"></div>
<div class="w-1.5 h-1.5 bg-secondary rounded-full typing-dot"></div>
<div class="w-1.5 h-1.5 bg-secondary rounded-full typing-dot"></div>
</div>
</div>
</div>
</main>
<!-- Bottom Input Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant p-3 pb-safe z-50">
<div class="flex items-center gap-3">
<button class="text-secondary p-2 active:scale-90 transition-all">
<span class="material-symbols-outlined">add_circle</span>
</button>
<div class="flex-1 relative">
<input class="w-full bg-surface-container-low border-none rounded-full py-2.5 px-5 text-body-md focus:ring-2 focus:ring-primary-container placeholder:text-secondary-fixed-dim" placeholder="Type your message..." type="text">
<button class="absolute right-2 top-1/2 -translate-y-1/2 text-primary p-1 active:scale-90 transition-all">
<span class="material-symbols-outlined">sentiment_satisfied</span>
</button>
</div>
<button class="w-10 h-10 flex items-center justify-center bg-primary rounded-full text-white active:scale-90 transition-all shadow-md">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
</div>
<!-- Hidden Bottom Nav Bar Logic (Suppressed for focused chat task as per rules) -->
<!-- The Navigation Shell is omitted here because the chat is a "Task-Focused" sub-page with a specific "Back" action. -->
<script>
        // Micro-interaction for clicking quick replies
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                // Haptic-like effect logic would go here
            });
        });

        // Simple scroll to bottom on load
        window.onload = () => {
            const main = document.querySelector('main');
            main.scrollTop = main.scrollHeight;
        };
    </script>
</body></html>
